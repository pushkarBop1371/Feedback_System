spring.application.name=feedback-tool

server.port=8081

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:feedbackdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow the React dev server to call this API
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# JWT
# app.jwt.secret must be a Base64-encoded key that is >= 256 bits once decoded
# (this is a DEV-ONLY key - generate and use a real secret, e.g. from an env var, in production)
app.jwt.secret=Zm9vYmFyLWRldi1vbmx5LXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2QtcGxlYXNlLTEyMzQ1Ng==
app.jwt.expiration-ms=86400000
